name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar arquivos do app
        run: |
          mkdir -p _site
          for z in $(find . -name '*.zip' -not -path './.git/*'); do unzip -o -q "$z" -d _site; done
          IDX=$(find . -name index.html -not -path './.git/*' -not -path './app/*' | head -1)
          if [ -z "$IDX" ]; then echo "ERRO: index.html nao encontrado"; exit 1; fi
          DIR=$(dirname "$IDX")
          echo "Site encontrado em: $DIR"
          mkdir -p app/www
          find "$DIR" -maxdepth 1 -type f ! -name '.*' -exec cp {} app/www/ \;
          ls -la app/www

      - name: Criar projeto Android
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "3ª Visão" "br.com.terceiravisao.app" -
