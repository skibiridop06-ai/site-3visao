name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar arquivos do app
        run: |
          IDX=$(find . -name index.html -not -path './.git/*' -not -path './app/*' | head -1)
          if [ -z "$IDX" ]; then echo "ERRO: index.html nao encontrado no repositorio"; exit 1; fi
          DIR=$(dirname "$IDX")
          echo "Site encontrado em: $DIR"
          mkdir -p app/www
          find "$DIR" -maxdepth 1 -type f ! -name '.*' -exec cp {} app/www/ \;
          ls -la app/www

      - name: Criar projeto Android
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "3ª Visão" "br.com.terceiravisao.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Colocar o ícone da 3ª Visão
        working-directory: app/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../www/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../www/icon-192.png "$d/ic_launcher_round.png"
            cp ../../../../../www/icon-192.png "$d/ic_launcher_foreground.png"
          done

      - name: Gerar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: 3visao-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
