      - name: Preparar arquivos do app
        run: |
          mkdir -p _site
          for z in $(find . -name '*.zip' -not -path './.git/*'); do unzip -o -q "$z" -d _site; done
          IDX=$(find ./_site -name index.html | head -1)
          [ -z "$IDX" ] && IDX=$(find . -name index.html -not -path './.git/*' -not -path './app/*' | head -1)
          if [ -z "$IDX" ]; then echo "ERRO: index.html nao encontrado"; exit 1; fi
          DIR=$(dirname "$IDX")
          mkdir -p app/www
          find "$DIR" -maxdepth 1 -type f ! -name '.*' -exec cp {} app/www/ \;
          ls -la app/www

      - name: Criar projeto Android
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "3ª Visão" "br.com.terceiravisao.app" --web-dir www
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Colocar o ícone da 3ª Visão
        run: |
          ICON=$(find "$GITHUB_WORKSPACE/app/www" -name 'icon-512.png' | head -1)
          if [ -z "$ICON" ]; then echo "Sem icone, usando o padrao"; exit 0; fi
          RES="$GITHUB_WORKSPACE/app/android/app/src/main/res"
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in "$RES"/mipmap-*; do
            cp "$ICON" "$d/ic_launcher.png"
            cp "$ICON" "$d/ic_launcher_round.png"
            cp "$ICON" "$d/ic_launcher_foreground.png"
          done

      - name: Gerar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/3visao.apk"

      - name: Publicar na Release (Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 3ª Visão v1.0.${{ github.run_number }}
          files: 3visao.apk
